<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar e video spiegazioni | Portale Didattico</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&family=Merriweather:wght@700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu&family=Noto+Sans+Gurmukhi:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#1e3a5f;--primary-light:#2c5282;--accent:#c9a227;--bg:#f7f9fc;--text:#1a202c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans Pro',sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:18px 30px;display:flex;align-items:center;gap:15px}
.logo-icon{width:50px;height:50px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.header h1{font-family:'Merriweather',serif;font-size:1.4em}.header p{font-size:.85em;opacity:.9}
main{max-width:900px;margin:0 auto;padding:25px 20px}
.langs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.langs button{padding:10px 18px;border:2px solid var(--primary);background:#fff;color:var(--primary);border-radius:25px;font:700 1em 'Source Sans Pro',sans-serif;cursor:pointer}
.langs button.on{background:var(--primary);color:#fff}
.screen{background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;border-radius:14px;padding:30px;min-height:470px;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);border-left:5px solid var(--accent);text-align:center}
.screen h2{font-family:'Merriweather',serif;font-size:1.7em;margin-bottom:4px}
.emoji{font-size:2.6em}
.expl{background:rgba(255,255,255,.12);border-radius:10px;padding:16px 20px;margin:14px 0;font-size:1.3em;line-height:1.7}
.expl.rtl{direction:rtl}
.expl.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2.4}.expl.ar{font-family:'Noto Sans Arabic',sans-serif}.expl.pa{font-family:'Noto Sans Gurmukhi',sans-serif}.expl.bn{font-family:'Noto Sans Bengali',sans-serif}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.row{background:#fff;color:var(--primary);border-radius:10px;padding:6px 14px;font-size:1.2em;display:flex;gap:8px;align-items:center}
.row b.p{color:#fff;background:var(--primary-light);border-radius:8px;padding:0 10px;font-size:.85em}
.end{background:var(--accent);color:var(--primary);border-radius:6px;padding:0 4px;font-weight:700}
.chip{border-radius:10px;padding:6px 14px;color:var(--primary);font-size:1.25em}
.chip b{font-size:1.2em}
table{margin:10px auto;border-collapse:separate;border-spacing:6px}
td,th{background:#fff;color:var(--primary);border-radius:8px;padding:5px 14px;font-size:1.1em}th{background:var(--accent)}
.ex{font-size:1.15em;opacity:.95;margin-top:6px}
.ctrl{display:flex;justify-content:center;gap:12px;margin-top:16px;align-items:center}
.ctrl button{border:none;border-radius:50%;width:52px;height:52px;font-size:1.3em;cursor:pointer;background:var(--primary);color:#fff}
.ctrl .play{width:64px;height:64px;background:var(--accent);color:var(--primary)}
.ctrl .it{width:auto;border-radius:26px;padding:0 18px;font-size:1em}
.bar{height:8px;background:#e2e8f0;border-radius:4px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.avatar{position:relative;width:200px;height:200px;margin:0 auto 10px}
.avatar canvas{width:100%;height:100%;border-radius:50%;border:4px solid var(--accent);background:#cfe3ee;display:block}
.avatar.talk canvas{animation:ring 1s ease-in-out infinite}
@keyframes nod{from{transform:scale(1) rotate(-.8deg)}to{transform:scale(1.035) rotate(.8deg)}}
.wave{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;height:22px;background:var(--accent);border-radius:12px;padding:0 10px}
.wave i{display:block;width:4px;height:4px;background:var(--primary);border-radius:2px;transition:height .1s}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(201,162,39,.6)}50%{box-shadow:0 0 0 14px rgba(201,162,39,0)}}
.avatar .flag{position:absolute;right:-6px;bottom:2px;font-size:2em;background:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.vstatus{text-align:center;font-size:.95em;margin:-6px 0 14px;color:#4a5568}.vstatus.warn{color:#b7791f;font-weight:600}
.vpick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:.85em;margin:-6px 0 14px;color:#4a5568}.vpick select{max-width:240px;padding:3px}
.count{text-align:center;color:#718096;margin-top:6px}
@media(max-width:600px){.screen{padding:20px 14px}.expl{font-size:1.1em}}
</style>
</head>

function render(){

  if (s.rows) body = '<div class="grid">' + s.rows.map(r=>`<div class="row"><b class="p">${r[0]}</b>${r[1]}</div>`).join('') + '</div>';
  if (s.chips) body = '<div class="grid">' + s.chips.map(c=>`<div class="chip" style="background:${c[2]}"><b>${c[0]}</b> · ${c[1]}</div>`).join('') + '</div>';
  if (s.trio) {
    const hd = ['','-ARE','-ERE','-IRE'], pn = ['', ...pr];
    body = '<table><tr>' + hd.map(h=>`<th>${h}</th>`).join('') + '</tr>' +
      s.trio.map((r,i)=>`<tr><td>${i?pn[i]:''}</td>` + r.map((x,j)=>i?`<td>${s.trio[0][j]}<span class="end">${x}</span></td>`:`<td>${x}</td>`).join('') + '</tr>').join('') + '</table>';
  }
  $('screen').innerHTML = `<div class="emoji">${s.e}</div><h2>${s.t}</h2>` +
    `<div class="expl ${l.rtl?'rtl':''} ${l.k}" lang="${l.v}">${s[l.k]}</div>${body}<div class="ex">${s.ex}</div>`;

let mouthT = null;
/* ===== Faccia: bocca animata sulla foto ===== */
const cv = $('avCanvas'), cx = cv.getContext('2d'), src = $('avSrc');
const CROP = {x: 60, y: 60}, MX = [240, 335], SEAM = 389;   // coordinate della bocca nella foto
let openCur = 0, openTarget = 0, raf = null;
function drawFace(o){
  if (!src.complete || !src.naturalWidth) return;
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,460,460);
  cx.translate(-CROP.x, -CROP.y);
  cx.drawImage(src, 0, 0);
  const sm = mouthT ? .6 : 1, a0 = MX[0] - 8, a1 = MX[1] + 8, md = (a0 + a1) / 2, hf = (a1 - a0) / 2, y0 = SEAM - 16;
  for (let x = a0; x < a1; x++) {
    const dy = Math.round(6 * sm * Math.pow(Math.abs(x - md) / hf, 2));
    if (dy > 0) cx.drawImage(src, x, y0 + dy, 1, 44, x, y0, 1, 44);
  }
  if (o < 0.3) return;
  const mid = (MX[0] + MX[1]) / 2, half = (MX[1] - MX[0]) / 2;
  for (let x = MX[0]; x < MX[1]; x++) {
    const w = Math.pow(Math.cos((x - mid) / half * Math.PI / 2), 0.8), sh = o * w;
    if (sh < 0.4) continue;
    cx.drawImage(src, x, SEAM, 1, 34, x, SEAM + sh, 1, 34);
    cx.fillStyle = '#2a0e12'; cx.fillRect(x, SEAM, 1, sh + 0.5);
    if (sh > 3) { cx.fillStyle = '#7a343b'; cx.fillRect(x, SEAM + sh * 0.62, 1, sh * 0.4); }
    if (w > 0.3 && sh > 3.5) { cx.fillStyle = '#efe9e1'; cx.fillRect(x, SEAM, 1, Math.min(3, sh * 0.45)); }
  }
}
function loop(){
  openCur += (openTarget - openCur) * 0.45;
  drawFace(openCur);
  if (mouthT || openCur > 0.3) raf = requestAnimationFrame(loop); else { raf = null; drawFace(0); }
}
src.onload = () => drawFace(0); if (src.complete) drawFace(0);
function startTalking(){
  stopTalking(); $('av').classList.add('talk');

function stopTalking(){
  clearInterval(mouthT); mouthT = null; openTarget = 0; $('av').classList.remove('talk');

}
function stop(){ clearTimeout(timer); sess++; stopTalking(); if(window.speechSynthesis) speechSynthesis.cancel(); }

let sess = 0, voices = [];

const pick = {};
function vscore(v,code){
  const c = code.toLowerCase(), vl = v.lang.replace('_','-').toLowerCase(), n = v.name;
  let s = vl === c ? 4 : 2;
  if (/natural|neural|online/i.test(n)) s += 6;
  else if (/premium|enhanced|siri/i.test(n)) s += 5;
  else if (/microsoft|apple/i.test(n)) s += 3;
  if (v.localService) s += 2;
  else if (/google/i.test(n)) s += 1;
  if (/espeak|compact|novelty|festival|flite/i.test(n)) s -= 8;
  return s;
}
function voicesFor(code){
  const p = code.slice(0,2).toLowerCase();
  return voices.filter(v => v.lang.replace('_','-').toLowerCase().startsWith(p)).sort((a,b) => vscore(b,code) - vscore(a,code));
}
function pickVoice(code){
  const id = pick[code.slice(0,2).toLowerCase()];
  const v = id && voices.find(x => x.voiceURI === id);
  return v || voicesFor(code)[0] || null;
}
function setV(code,id){ pick[code.slice(0,2).toLowerCase()] = id; updateStatus(); }
function opts(code){ const cur = pickVoice(code); return voicesFor(code).map(v => `<option value="${v.voiceURI}"${v === cur ? ' selected' : ''}>${v.name} (${v.lang})</option>`).join(''); }
function updateStatus(){
  const el = $('vstatus'), pk = $('vpick'), l = L[li], nm = l.n.split(' ').slice(1).join(' ');

  const v = pickVoice(l.v), it = pickVoice('it-IT');
  const ff = /Firefox/i.test(navigator.userAgent) && it && !/natural|neural|online|premium|enhanced/i.test(it.name);
  if (v) { el.className = 'vstatus'; el.textContent = '🔊 Se la voce non ti piace, scegline un\'altra qui sotto' + (it ? '' : ' · ⚠️ manca la voce italiana') + (ff ? ' · Firefox usa solo le voci del sistema: per voci più naturali usa Edge o Chrome.' : ''); }
  else { el.className = 'vstatus warn'; el.textContent = '⚠️ Su questo dispositivo manca la voce per ' + nm + '. Installala da Impostazioni › Lingua › Sintesi vocale (Android/Windows) oppure prova Chrome o Edge. Intanto leggi il testo.'; }
  pk.innerHTML = (v ? `<label>Voce ${nm}: <select onchange="setV('${l.v}',this.value)">${opts(l.v)}</select> <button onclick="testV('${l.v}')">▶ prova</button></label>` : '') +
    (it ? `<label>Voce italiano: <select onchange="setV('it-IT',this.value)">${opts('it-IT')}</select> <button onclick="testV('it-IT')">▶ prova</button></label>` : '');
}
const RO_IT = /(ESSERE|AVERE|STARE|CHIAMARSI|Ho 20 anni|Come stai\? Sto bene|Mi chiamo Anna|mi, ti, si, ci, vi, si|\((?:il|un),[^)]*\)|-ARE, -ERE(?: \w+)? -IRE|io -o, tu -i, lui\/lei -a\/-e)/;
const LAT = /(-?[A-Za-z][A-Za-z0-9'’\/\-]*(?:[ ,]+-?[A-Za-z0-9][A-Za-z0-9'’\/\-]*)*[?!]?)/;
function chunk(t){
  const out = []; let cur = '';
  t.split(/(?<=[.!?؟۔।:。！？])\s*/).filter(Boolean).forEach(x => {
    if ((cur + ' ' + x).length > 150 && cur) { out.push(cur); cur = x; } else cur = (cur + ' ' + x).trim();
  });
  if (cur) out.push(cur);
  return out;
}
function segsOf(txt, l){
  const parts = txt.split(l.lat ? RO_IT : LAT), out = [];
  parts.forEach((p, i) => {
    if (!/[\p{L}\p{N}]/u.test(p)) return;
    if (i % 2 === 1) out.push({text: p.replace(/[\/\-()]/g,' ').replace(/\s+/g,' ').trim().toLowerCase(), lang:'it-IT', rate:.85});
    else chunk(p.replace(/[«»“”„"()]/g,' ').replace(/\s+/g,' ').trim()).forEach(c => out.push({text:c, lang:l.v, rate:.95}));
  });
  return out;
}
let curU = null;
function cands(code){
  const p = pickVoice(code), all = voicesFor(code);
  return (p ? [p].concat(all.filter(v => v !== p)) : all).slice(0,4);
}
function warnVoice(){
  const el = $('vstatus'); el.className = 'vstatus warn';
  el.textContent = '⚠️ La voce non parte: scegline un\'altra dal menu qui sotto, oppure prova Edge o Chrome aggiornati.';
}
function say(segs, done){
  const my = ++sess;
  speechSynthesis.cancel();
  startTalking();
  let i = 0;
  function nxt(){
    if (my !== sess) return;
    if (i >= segs.length) { stopTalking(); if(done) done(); return; }
    const g = segs[i++];
    attempt(g, cands(g.lang), 0, () => setTimeout(nxt, 60));
  }
  function attempt(g, cs, k, next){
    if (my !== sess) return;
    const v = cs[k], u = new SpeechSynthesisUtterance(g.text);
    curU = u; /* Chrome perde l'utterance e non invia onend se non la teniamo */
    u.lang = v ? v.lang : g.lang; if (v) u.voice = v;
    u.rate = g.rate; u.volume = 1; u.pitch = 1;
    let fin = false, started = false, wd, st;
    const finish = ok => {
      if (fin) return; fin = true; clearTimeout(wd); clearTimeout(st);
      if (my !== sess) return;
      if (!ok && k + 1 < cs.length) { speechSynthesis.cancel(); setTimeout(() => attempt(g, cs, k + 1, next), 150); return; }
      if (!ok) warnVoice();
      else if (v && pick[g.lang.slice(0,2).toLowerCase()] !== v.voiceURI) { pick[g.lang.slice(0,2).toLowerCase()] = v.voiceURI; updateStatus(); }
      next();
    };
    u.onstart = () => { started = true; clearTimeout(st); };
    u.onend = () => finish(started);
    u.onerror = () => finish(false);
    st = setTimeout(() => finish(false), 4000);
    wd = setTimeout(() => finish(started), 4000 + g.text.length * 150);
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  }
  setTimeout(nxt, 250);
}
function testV(code){
  stop();
  const l = L[li], g = code.startsWith('it') ? [{text:'Ciao! Io sono Maria.', lang:'it-IT', rate:.85}] : segsOf(S[si][l.k], l).slice(0,1);
  say(g);
}
function playSlide(){
  stop();
  const txt = S[si][L[li].k], l = L[li];
  if (TTS && pickVoice(l.v)) {
    say(segsOf(txt, l), () => { if(playing) timer = setTimeout(next, 2000); });
  } else {
    startTalking();
    timer = setTimeout(() => { stopTalking(); if(playing) timer = setTimeout(next, 1500); }, 3000 + txt.length * 60);
  }
}
function speakIt(){
  if (!TTS) return;
  stop();
  const s = S[si];
  const segs = (s.rows ? s.rows.map(r => r[0] + ', ' + r[1]) : s.chips ? s.chips.map(c => c[1]) : [s.ex.replace(/[·=]/g,',')])
    .map(t => ({text: t.replace(/[\/\-()]/g,' '), lang:'it-IT', rate:.8}));
  say(segs);
}
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(loadVoices, 2000); }
render();
</script>
